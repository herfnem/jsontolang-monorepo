name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same gate as CI: a tag must not ship anything that wouldn't pass on main.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck

      - name: Build + lint (crates, plugins, web)
        run: ./scripts/check.sh

  release:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: x86_64-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p jsontolang -p jsontolang-tui

      - name: Package
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release"
          tar -czf "dist/jsontolang-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz" \
            -C "$bin" jsontolang \
            -C "$GITHUB_WORKSPACE/crates/cli" \
            plugins/typescript.lua plugins/rust.lua plugins/go.lua
          tar -czf "dist/jsontolang-tui-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz" \
            -C "$bin" jsontolang-tui

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.suffix }}
          path: dist/*.tar.gz

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
